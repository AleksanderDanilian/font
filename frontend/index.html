<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fontasize — find a typeface by description</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>

<div class="app" x-data="fontMatcher()" x-init="init()">

  <!-- ============ Header ============ -->
  <header class="masthead">
    <div class="masthead__mark">Fontasize</div>
    <div class="masthead__sub">find a typeface by description · <span x-text="totalFontsLabel"></span></div>
  </header>

  <div class="layout">

    <!-- ============ Input panel ============ -->
    <aside class="panel">

      <div class="field">
        <label class="field__label" for="text-input">Describe the style</label>
        <textarea
          id="text-input"
          class="field__textarea"
          x-model="query.text"
          placeholder="e.g. for a women's cosmetics brand, soft and premium"
          rows="3"
        ></textarea>
      </div>

      <div class="field">
        <div class="field__label">Mood <span class="field__hint">up to 4</span></div>
        <div class="tags">
          <template x-for="tag in tags" :key="tag.id">
            <button
              type="button"
              class="tag"
              :class="{
                'tag--active': selectedTagIds.includes(tag.id),
                'tag--disabled': isTagDisabled(tag.id)
              }"
              :disabled="isTagDisabled(tag.id)"
              @click="toggleTag(tag.id)"
              x-text="tag.label_en"
            ></button>
          </template>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="preview-input">
          Preview text <span class="field__hint">optional</span>
        </label>
        <input
          id="preview-input"
          type="text"
          class="field__input"
          x-model="query.preview_text"
          :placeholder="defaultPreviewPlaceholder"
        >
      </div>

      <div class="field">
        <label class="field__label">Languages</label>

        <details class="lang-dropdown" @toggle="focusLanguageSearch($el)">
          <summary class="lang-dropdown__summary">
            <span x-text="query.languages.length + ' selected'"></span>
          </summary>
          <div class="lang-dropdown__panel">
            <input
              type="text"
              class="lang-search"
              x-model="languageSearch"
              placeholder="Type to search…"
              @click.stop
            >
            <div class="lang-dropdown__list">
              <template x-for="lang in sortedFilteredLanguages" :key="lang.code">
                <label
                  class="lang-option"
                  :class="{ 'lang-option--selected': query.languages.includes(lang.code) }"
                >
                  <input
                    type="checkbox"
                    :value="lang.code"
                    :checked="query.languages.includes(lang.code)"
                    @change="toggleLanguage(lang.code)"
                  >
                  <span x-text="lang.label"></span>
                </label>
              </template>
              <p class="lang-dropdown__empty" x-show="sortedFilteredLanguages.length === 0">No matches</p>
            </div>
          </div>
        </details>

        <div class="lang-chips" x-show="selectedLanguageObjects.length">
          <template x-for="lang in selectedLanguageObjects" :key="lang.code">
            <span class="lang-chip">
              <span x-text="lang.label"></span>
              <button
                type="button"
                class="lang-chip__remove"
                @click="toggleLanguage(lang.code)"
                aria-label="Remove"
              >&times;</button>
            </span>
          </template>
        </div>
      </div>

      <button
        type="button"
        class="btn btn--primary btn--block"
        @click="applySearch()"
        :disabled="loading"
      >
        <span x-show="!loading">Apply</span>
        <span x-show="loading">Searching…</span>
      </button>

      <p class="panel__error" x-show="errorMessage" x-text="errorMessage"></p>

    </aside>

    <!-- ============ Results ============ -->
    <main class="results">

      <div class="empty-state" x-show="!loading && hasSearched && fonts.length === 0">
        <p class="empty-state__title">Nothing found</p>
        <p class="empty-state__body">
          Try removing some tags, choosing another language, or rephrasing your description.
        </p>
      </div>

      <div class="empty-state" x-show="!hasSearched && !loading">
        <p class="empty-state__title">Nothing here yet</p>
        <p class="empty-state__body">
          Describe the style on the left and hit Apply — your font picks will show up here.
        </p>
      </div>

      <div class="grid" x-show="fonts.length > 0">
        <template x-for="font in fonts" :key="font.slug">
          <article
            class="card"
            :style="cardFontStyle(font)"
          >
            <div class="card__top">
              <span class="card__name" x-text="font.family_name"></span>
              <span class="card__premium" x-show="font.is_premium">Premium</span>
            </div>

            <p class="card__specimen card__specimen--mixed" x-text="previewTextFor(font)"></p>
            <p class="card__specimen card__specimen--caps" x-text="previewTextFor(font).toUpperCase()"></p>

            <div class="card__rule"></div>

            <div class="card__meta">
              <span class="card__category" x-text="font.category || '—'"></span>
              <span class="card__moods">
                <template x-for="m in font.mood_tags" :key="m">
                  <span class="card__mood" x-text="m"></span>
                </template>
              </span>
            </div>

            <a
              class="card__link"
              x-show="font.is_premium && font.referral_url"
              :href="font.referral_url"
              target="_blank"
              rel="noopener"
            >Go to partner →</a>
          </article>
        </template>
      </div>

      <div class="load-more" x-show="hasMore && fonts.length > 0">
        <button type="button" class="btn btn--secondary" @click="loadMore()" :disabled="loadingMore">
          <span x-show="!loadingMore">Load more</span>
          <span x-show="loadingMore">Loading…</span>
        </button>
      </div>

    </main>

  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
